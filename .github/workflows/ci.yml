name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  secrets-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

  quality:
    name: Lint, types, unit tests, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: npm audit (production deps must be clean)
        run: npm audit --omit=dev --audit-level=low
      - name: 'npm audit (dev deps: no high/critical)'
        run: npm audit --audit-level=high

  database:
    name: DB migrations, RLS, scheduler, realtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Start local Supabase (staging stack, never production)
        run: npm run db:start
      - run: npm run test:db

  desktop-e2e:
    name: Desktop e2e (Electron + local Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Smoke test (security settings, CSP, IPC, RTL alert, crash recovery)
        working-directory: apps/desktop
        run: npm run build && xvfb-run -a node e2e/smoke.mjs
      - name: Start local Supabase
        run: npm run db:start
      - name: Full flow (sign-in, bot RPC -> realtime -> alert -> Done/Snooze -> revoke)
        working-directory: apps/desktop
        run: |
          KEY=$(npx supabase status -o json | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).PUBLISHABLE_KEY))")
          MAIN_VITE_SUPABASE_URL=http://127.0.0.1:54321 MAIN_VITE_SUPABASE_PUBLISHABLE_KEY=$KEY npm run build
          xvfb-run -a node e2e/sync.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-screenshots
          path: apps/desktop/e2e/artifacts
          retention-days: 7

  windows-build:
    name: Windows installer (unsigned)
    runs-on: windows-2025
    timeout-minutes: 30
    needs: [quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build installer
        working-directory: apps/desktop
        env:
          RELEASES_OWNER: ${{ github.repository_owner }}
        run: npm run dist:win
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-unsigned
          path: apps/desktop/release/*/DeskBuddy-Setup-*.exe
          retention-days: 7
