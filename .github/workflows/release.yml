name: Release

# Tag a commit on main (e.g. `git tag v0.2.0 && git push origin v0.2.0`).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-windows:
    name: Signed Windows release
    runs-on: windows-2025
    timeout-minutes: 45
    environment: production # required reviewers + secrets live on this GitHub environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Only release commits that are on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main; refusing to release."; exit 1
          fi

      - name: Tag matches package version
        shell: bash
        run: |
          v=$(node -p "require('./apps/desktop/package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != package version v$v"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm audit --omit=dev --audit-level=low

      - name: Build, sign (Azure Trusted Signing) and publish
        working-directory: apps/desktop
        env:
          # Public by design (RLS-bound publishable key), injected at build time.
          MAIN_VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          MAIN_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          RELEASES_OWNER: ${{ github.repository_owner }}
          # Fine-grained PAT: contents:write on <owner>/desk-buddy-releases only.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Azure service principal with the "Trusted Signing Certificate Profile Signer" role.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: bash
        run: |
          npx electron-vite build
          npx electron-builder --win --x64 --publish always \
            --config.win.azureSignOptions.publisherName="${{ vars.WIN_PUBLISHER_NAME }}" \
            --config.win.azureSignOptions.endpoint="${{ vars.AZURE_SIGNING_ENDPOINT }}" \
            --config.win.azureSignOptions.certificateProfileName="${{ vars.AZURE_CERT_PROFILE }}" \
            --config.win.azureSignOptions.codeSigningAccountName="${{ vars.AZURE_SIGNING_ACCOUNT }}"

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release/*/DeskBuddy-Setup-*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Status: $($sig.Status)  Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Installer is not validly signed" }
